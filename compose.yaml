# ==============================================================================
# Bremspace ERP & POS System - Universal Docker Compose Stack
# Brand: Bremspace
# Port Default: 1741 (Akses Localhost & Multi-Device LAN)
# ==============================================================================
name: bremspace-erp

services:
  # 1. Aplikasi Core PHP 8.5+ FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bremspace-erp-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - TZ=Asia/Jakarta
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - BREMSPACE_HOST_CHALLENGE=${BREMSPACE_HOST_CHALLENGE:-}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-bremspace_erp}
      - DB_USERNAME=${DB_USERNAME:-bremspace}
      - DB_PASSWORD=${DB_PASSWORD:-bremspace_secret}
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - bremspace-network
    depends_on:
      - db

  # 2. Web Server Nginx (Port 1741)
  web:
    image: nginx:1.27-alpine
    container_name: bremspace-erp-web
    restart: unless-stopped
    ports:
      - "1741:1741"
      # - "80:80"
      # - "443:443"
    volumes:
      - .:/var/www/html:ro
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bremspace-network
    depends_on:
      - app

  # 3. Database MySQL 8.4 LTS Lokal (Persistent Volume di Host)
  db:
    image: mysql:8.4
    container_name: bremspace-erp-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-bremspace_root_secret}}
      MYSQL_DATABASE: ${DB_DATABASE:-bremspace_erp}
      MYSQL_USER: ${DB_USERNAME:-bremspace}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bremspace_secret}
    volumes:
      - bremspace-mysql-data:/var/lib/mysql
    networks:
      - bremspace-network

  # 4. Background Queue Worker (Headless)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bremspace-erp-queue
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]
    environment:
      - TZ=Asia/Jakarta
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-bremspace_erp}
      - DB_USERNAME=${DB_USERNAME:-bremspace}
      - DB_PASSWORD=${DB_PASSWORD:-bremspace_secret}
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - bremspace-network
    depends_on:
      - app
      - db

volumes:
  bremspace-public:
  bremspace-mysql-data:

networks:
  bremspace-network:
    driver: bridge
