; ==============================================================================
; Bremspace ERP & POS System — Custom PHP 8.5+ Runtime Configuration
; ==============================================================================

[PHP]
variables_order = "EGPCS"
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = Asia/Jakarta
expose_php = Off

; Error handling for production performance
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = /var/www/html/storage/logs/php_error.log

; Session configuration
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.use_strict_mode = 1

; ==============================================================================
; Zend OPcache Engine (Mandatory for Laravel 13 & Livewire 3 Performance)
; ==============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1
