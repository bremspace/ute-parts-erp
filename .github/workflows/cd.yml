name: CD Pipeline (Zero-Downtime Deployment)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-cd-deployment
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build & Package (Offloaded to Runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, openssl, pcre, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Compile Frontend Assets (Vite)
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json || (echo "Vite manifest missing!" && exit 1)

      - name: Package Compiled Build Artifacts
        run: |
          tar -czf public-build.tar.gz -C public build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: public-build.tar.gz
          retention-days: 1

  deploy-to-vps:
    name: Deploy to Bare-Metal VPS
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts
          path: .

      - name: Transfer Pre-built Assets to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'public-build.tar.gz'
          target: '/tmp'

      - name: Execute Deployment & Proactive Verification over SSH
        uses: appleboy/ssh-action@master
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/ute-parts-erp' }}
          APP_URL: ${{ secrets.APP_URL || 'https://test.uteparts.id' }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,APP_URL,DEPLOY_SECRET,HEALTH_CHECK_SECRET
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # 1. Store last known good commit for rollback reference
            git rev-parse HEAD > .last_known_good_commit
            LAST_GOOD=$(cat .last_known_good_commit)
            echo "Last known good commit stored: $LAST_GOOD"

            rollback() {
              echo "::error::Deployment verification failed! Initiating automated rollback to $LAST_GOOD..."
              cd "$DEPLOY_PATH"

              # Graceful maintenance while resetting
              php artisan down --render="errors::503" --secret="${DEPLOY_SECRET}" --retry=60 || true

              # Checkout last known good commit
              git checkout -f "$LAST_GOOD" || git reset --hard "$LAST_GOOD"

              # Re-install dependencies & rebuild caches
              COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction || true
              php artisan optimize:clear || true
              php artisan config:cache || true
              php artisan route:cache || true
              php artisan view:cache || true
              php artisan event:cache || true

              # Restart background workers
              php artisan queue:restart || true
              supervisorctl restart uteparts-worker:* 2>/dev/null || true
              systemctl reload php8.4-fpm 2>/dev/null || true

              # Bring application back online
              php artisan up || true
              echo "::error::Rollback completed. Application restored to $LAST_GOOD."
              exit 1
            }

            trap 'rollback' ERR

            # 2. Activate graceful maintenance mode with secret bypass
            echo "Activating maintenance mode..."
            php artisan down --render="errors::503" --secret="${DEPLOY_SECRET}" --retry=60

            # 3. Pull latest code on main
            echo "Pulling latest code from origin/main..."
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main

            # 4. Sync compiled frontend artifacts
            echo "Syncing pre-compiled frontend artifacts..."
            if [ -f /tmp/public-build.tar.gz ]; then
              tar -xzf /tmp/public-build.tar.gz -C "$DEPLOY_PATH/public"
              rm -f /tmp/public-build.tar.gz
            fi

            # 5. Production dependency refresh
            echo "Updating composer dependencies..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            # 6. Database schema migrations
            echo "Running database migrations..."
            php artisan migrate --force

            # 7. Refresh production cache layers
            echo "Refreshing cache layers..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # 8. Fix file permissions
            echo "Enforcing file permissions..."
            chown -R www-data:www-data storage bootstrap/cache public/build
            chmod -R 775 storage bootstrap/cache

            # 9. Restart background workers & reload FPM
            echo "Restarting background queue workers..."
            php artisan queue:restart
            supervisorctl restart uteparts-worker:* 2>/dev/null || true
            systemctl reload php8.4-fpm 2>/dev/null || true

            # 10. Bring application back online
            echo "Bringing application online..."
            php artisan up

            # 11. Verification & Active Health Check (Polling loop 6x at 5s interval)
            echo "Executing active health check against $APP_URL/api/health..."
            HEALTH_URL="$APP_URL/api/health"
            SECRET_VAL="${HEALTH_CHECK_SECRET:-$(grep '^HEALTH_CHECK_SECRET=' .env | cut -d '=' -f2-)}"

            MAX_RETRIES=6
            INTERVAL=5
            RETRY=0
            SUCCESS=0

            while [ $RETRY -lt $MAX_RETRIES ]; do
              HTTP_CODE=$(curl -s -o /tmp/health_status.json -w "%{http_code}" -H "X-Health-Check-Secret: ${SECRET_VAL}" "$HEALTH_URL" || echo "000")

              if [ "$HTTP_CODE" -eq 200 ] && grep -q '"status":"healthy"' /tmp/health_status.json 2>/dev/null; then
                echo "Health check PASSED (HTTP 200 OK):"
                cat /tmp/health_status.json
                SUCCESS=1
                break
              fi

              RETRY=$((RETRY + 1))
              echo "Health check attempt $RETRY/$MAX_RETRIES failed (HTTP $HTTP_CODE). Retrying in ${INTERVAL}s..."
              sleep $INTERVAL
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "::error::Health check failed after $MAX_RETRIES retries!"
              cat /tmp/health_status.json 2>/dev/null || true
              rollback
            fi

            echo "Deployment verified healthy and successfully completed."
