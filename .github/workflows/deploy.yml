name: CI/CD Pipeline (Test & Auto-Deploy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # TAHAP 1: CI (Continuous Integration / Test)
  # ==========================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite3, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan Environment Pengujian
        run: |
          cp .env.example .env.testing || cp .env.example .env
          php artisan key:generate --env=testing

      - name: Jalankan Unit & Feature Tests
        run: php artisan test --colors=always

  # ==========================================
  # TAHAP 2: CD (Continuous Deployment ke VPS Root)
  # Hanya jalan jika job 'test' SUKSES (lolos) dan event adalah push ke 'main'
  # ==========================================
  deploy:
    name: Deploy ke VPS Production (Root)
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Eksekusi Deploy di VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${VPS_PATH:-/var/www/test.uteparts.id-staging}"
            PHP_BIN="${PHP_BIN:-/usr/bin/php}"
            WEB_USER="${WEB_USER:-www-data}"
            QUEUE_NAME="${QUEUE_NAME:-ute-parts-queue}"

            echo "🚀 Memulai Deployment di: $DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "❌ Direktori $DEPLOY_PATH bukan repositori git yang valid."
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # Ambil hash commit sebelum update (untuk rollback jika deploy crash)
            PREV_COMMIT=$(git rev-parse HEAD)

            # Tarik commit terbaru
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies produksi
            composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

            # Jalankan migrasi database
            "$PHP_BIN" artisan migrate --force

            # Build asset UI
            npm install --ignore-scripts --no-audit --no-fund
            npm run build

            # Refresh cache Laravel
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache

            # Set permission www-data
            chown -R "$WEB_USER":"$WEB_USER" storage bootstrap/cache public/build
            chmod -R 775 storage bootstrap/cache

            # Restart queue worker supervisor jika tersedia
            if command -v supervisorctl >/dev/null 2>&1; then
              supervisorctl restart "$QUEUE_NAME" || true
            fi

            echo "✅ Deployment Sukses ke commit: $(git rev-parse --short HEAD)"
