name: CI/CD Pipeline (Auto-Deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ==========================================
  # CD (Continuous Deployment ke VPS Production)
  # ==========================================
  deploy:
    name: Deploy ke VPS Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Eksekusi Deploy di VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${VPS_PATH:-/var/www/uteparts.id}"
            PHP_BIN="${PHP_BIN:-/usr/bin/php8.4}"
            WEB_USER="${WEB_USER:-www-data}"
            QUEUE_NAME="${QUEUE_NAME:-ute-parts-prod-queue}"

            echo "🚀 Memulai Deployment di: $DEPLOY_PATH"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "❌ Direktori $DEPLOY_PATH bukan repositori git yang valid."
              exit 1
            fi

            cd "$DEPLOY_PATH"

            # Ambil hash commit sebelum update
            PREV_COMMIT=$(git rev-parse HEAD)

            # Tarik commit terbaru
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies produksi
            composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

            # Jalankan migrasi database
            "$PHP_BIN" artisan migrate --force

            # Build asset UI
            npm install --ignore-scripts --no-audit --no-fund
            npm run build

            # Refresh cache Laravel
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache

            # Set permission
            chown -R "$WEB_USER":"$WEB_USER" storage bootstrap/cache public/build
            chmod -R 775 storage bootstrap/cache

            # Restart queue worker supervisor
            if command -v supervisorctl >/dev/null 2>&1; then
              supervisorctl restart "$QUEUE_NAME" || true
            fi

            echo "✅ Deployment Sukses ke commit: $(git rev-parse --short HEAD)"
