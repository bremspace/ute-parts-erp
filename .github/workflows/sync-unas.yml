name: Sync Unas from Brem

# Otomatis menyerap update dari `brem` ke branch kolaborator `Unas`,
# supaya perbaikan/koreksi di brem langsung ikut tanpa bergantung aturan AGENTS.md.
# Trigger: tiap push ke brem, plus schedule tiap 6 jam sebagai pengaman.

on:
  push:
    branches: [brem, main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-unas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Unas
          fetch-depth: 0

      - name: Merge brem into Unas
        env:
          GIT_AUTHOR_NAME: bremspace-bot
          GIT_AUTHOR_EMAIL: bot@bremspace.id
          GIT_COMMITTER_NAME: bremspace-bot
          GIT_COMMITTER_EMAIL: bot@bremspace.id
        run: |
          set -e
          git fetch origin brem
          # Sudah terbarui? lewati.
          if git merge-base --is-ancestor origin/brem HEAD; then
            echo "SYNC_SKIP: Unas sudah memuat brem terbaru"
            exit 0
          fi
          if git merge origin/brem --no-edit; then
            git push origin Unas
            echo "SYNC_OK: brem -> Unas"
          else
            echo "SYNC_CONFLICT: merge brem -> Unas bentrok, perlu resolusi manual oleh Unas"
            git merge --abort
            exit 1
          fi
