name: Sync Unas from Brem

# Menyerap update dari `brem`/`main` ke branch kolaborator `Unas` secara otomatis,
# supaya perbaikan/koreksi di brem/main selalu ikut tanpa bergantung aturan AGENTS.md.
# Trigger: tiap push ke brem atau main, plus schedule tiap 6 jam sebagai pengaman.
# Setelah sinkron, workflow ini juga melaporkan file yang masih MENYIMPANG dari brem
# (mis. commit Unas yang membatalkan revisi) lewat issue pelacak, agar Unas menelaah.

on:
  push:
    branches: [brem, main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sync-unas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Unas
          fetch-depth: 0

      - name: Merge brem into Unas
        id: merge
        env:
          GIT_AUTHOR_NAME: bremspace-bot
          GIT_AUTHOR_EMAIL: bot@bremspace.id
          GIT_COMMITTER_NAME: bremspace-bot
          GIT_COMMITTER_EMAIL: bot@bremspace.id
        run: |
          set -e
          git fetch origin brem main
          if git merge-base --is-ancestor origin/brem HEAD; then
            echo "SYNC_SKIP: Unas sudah memuat brem terbaru"
            exit 0
          fi
          if git merge origin/brem --no-edit; then
            git push origin Unas
            echo "SYNC_OK: brem -> Unas"
            # Commit bot (GITHUB_TOKEN) tidak memicu workflow lain, jadi CI
            # harus dipicu eksplisit agar sha hasil sync punya run sendiri.
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "SYNC_CONFLICT: merge brem -> Unas bentrok, perlu resolusi manual oleh Unas"
            git merge --abort
            exit 1
          fi

      - name: Picu CI untuk commit hasil sync
        if: steps.merge.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref Unas

      - name: Deteksi simpangan & laporkan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin brem Unas
          DIVERGENT=$(git diff --name-only origin/brem origin/Unas | sort -u || true)
          SUMMARY="$GITHUB_STEP_SUMMARY"
          if [ -z "$DIVERGENT" ]; then
            echo "✅ Unas sejajar dengan brem (tidak ada simpangan)." >> "$SUMMARY"
            exit 0
          fi
          {
            echo "⚠️ **Unas menyimpang dari brem** pada file berikut — perlu review/revisi oleh Unas:"
            echo ""
            echo "$DIVERGENT" | sed 's/^/• /'
          } >> "$SUMMARY"
          gh label create sync-unas-divergence --force >/dev/null 2>&1 || true
          BODY=$(printf 'Sinkronisasi brem -> Unas mendapati file yang masih menyimpang dari brem:\n\n```\n%s\n```\n\nUnas perlu menelaah dan menyerapkan revisi dari brem (mis. membatalkan commit yang menyimpang).' "$DIVERGENT")
          EXIST=$(gh issue list --state open --label sync-unas-divergence --limit 1 --json number -q '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body "$BODY"
            echo "Memperbarui issue #$EXIST"
          else
            gh issue create --title "[sync] Unas menyimpang dari brem — perlu revisi" --body "$BODY" --label sync-unas-divergence
            echo "Membuka issue pelacak baru"
          fi
