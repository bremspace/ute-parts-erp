[program:uteparts-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/ute-parts-erp/artisan queue:work database --queue=default,sync --sleep=3 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/uteparts-worker.log
stopwaitsecs=3600
