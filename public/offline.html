<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Ute Parts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(1200px 600px at 20% -10%, #1a1440 0%, #0B0D17 55%);
      color: #E6E8F2; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; text-align: center;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px; padding: 40px 28px; backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px; display: block;
      background: linear-gradient(135deg, #5B4FE9, #8B5CF6); border-radius: 20px;
      padding: 16px; box-shadow: 0 12px 32px rgba(91,79,233,.4);
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.6; color: #9CA3C4; margin-bottom: 20px; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #5B4FE9, #7C3AED); color: #fff;
      font-size: 15px; font-weight: 600; transition: opacity .2s, transform .1s;
    }
    button:hover { opacity: .9; }
    button:active { transform: scale(.98); }
    .features { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 20px 0; }
    .features span {
      font-size: 12px; padding: 10px; border-radius: 12px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
      color: #B9BFDA;
    }
    .status { font-size: 12px; color: #6B7280; margin-top: 8px; }
    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22C55E; margin-right: 6px; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
    </svg>
    <h1>Kamu sedang offline</h1>
    <p>Koneksi internet terputus. Periksa jaringanmu, lalu coba lagi — atau selesaikan pekerjaan berikut yang tetap bisa diakses.</p>
    <div class="features">
      <span>✅ Keranjang POS tersimpan</span>
      <span>✅ Struk menunggu cetak</span>
      <span>✅ Data produk ter-cache</span>
      <span>✅ Auto-sinkron saat online</span>
    </div>
    <button onclick="location.reload()">⟳ Coba Lagi</button>
    <div class="status"><span class="pulse"></span>Menunggu koneksi…</div>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
