services:
  openwa-api:
    image: rmyndharis/openwa:latest
    container_name: openwa-api
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "127.0.0.1:2785:2785"
    env_file:
      - .env
    volumes:
      - /opt/openwa/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2785/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
