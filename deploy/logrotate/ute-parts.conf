# ute-parts.conf — rotasi log Laravel (F1-7, PRD-Advanced-UteParts §4)
#
# copytruncate: dipakai karena PHP-FPM masih memegang file descriptor,
# jadi tidak perlu restart service (hemat resource di server 1GB).
#
# ⚠️  PATH DI BAWAH UNTUK VPS MANDIRI: /var/www/ute-parts
#     Bila lokasi project-mu BEDA, sesuaikan sebelum install:
#       sed -i 's#/var/www/ute-parts#/path/kamu#g' /etc/logrotate.d/ute-parts
#
# Install:
#   cp deploy/logrotate/ute-parts.conf /etc/logrotate.d/ute-parts
#   logrotate -d /etc/logrotate.d/ute-parts   # dry-run verifikasi

/var/www/ute-parts/storage/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    create 0644 www-data www-data
}
