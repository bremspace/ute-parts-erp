# ute-parts.conf — rotasi log Laravel (F1-7, PRD-Advanced-UteParts §4)
# copytruncate: PHP-LSAPI/OSS holding FD tidak perlu di-restart (server 1GB).
#
# Install:
#   cp deploy/logrotate/ute-parts.conf /etc/logrotate.d/ute-parts
#   logrotate -d /etc/logrotate.d/ute-parts   # dry-run verifikasi

/var/www/test.uteparts.id-staging/storage/logs/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    create 0644 www-data www-data
}
