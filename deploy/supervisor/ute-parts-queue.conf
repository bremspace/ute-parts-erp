; =============================================================
; ute-parts-queue — Supervisor program + group config (F1-7)
; PRD-Advanced-UteParts §4 F1-7 · RAM 1GB → 1 proses worker.
;
; PATH DI BAWAH TIDAK DI-HARDCODE. Dua cara menyetelnya:
;
; (1) LANGSUNG — ganti satu variabel di file ini:
;       ; di baris [program:ute-parts-queue]
;       environment=UTE_PATH="/var/www/nama-project"
;     Pendek: `sed -i 's#UTE_PATH="/var/www/nama-project"#UTE_PATH="/path/kamu"#' <file>`
;
; (2) LEWAT ENVIRONMENT FILE milik supervisord (disarankan, supaya
;     repo tidak pernah menyimpan path server):
;       ; di /etc/supervisor/supervisord.conf
;       [include]
;       files = /etc/supervisor/conf.d/*.conf
;     ; lalu tambahkan EnvironmentFile di SEBUAH file .conf milikmu:
;       ;   /etc/supervisor/conf.d/ute-parts-env.conf
;       [supervisord]
;       environment=UTE_PATH="/var/www/nama-project",UTE_PHP="/usr/bin/php8.3"
;     `%(ENV_UTE_PATH)s` di bawah otomatis mengambilnya.
;     Variabel yang ABSEN akan membuat supervisor menolak start —
;     itu memang yang diinginkan: lebih gagal keras daripada diam-diam
;     memakai path yang tidak ada.
;
; ⚠️  LANGKAH WAJIB sebelum `supervisorctl update`:
;     1) set UTE_PATH ke direktori yang BENAR-BENAR ada (cwd project Laravel,
;        yang isi foldernya `artisan`).
;     2) set UTE_PHP ke binary PHP CLI yang ada:
;          find /usr -name "php" -path "*/bin/*" 2>/dev/null | head -1
;          (server CyberPanel/OpenLiteSpeed: /usr/local/lsws/lsphp85/bin/php)
;     3) pastikan user di bawah boleh menulis ke storage/ dan storage/logs/.
;
; CARA PAKAI SINGKAT (copy konfigurasi sudah jadi):
;   sudo cp deploy/supervisor/ute-parts-queue.conf /etc/supervisor/conf.d/
;   sudo sed -i \
;     -e 's#UTE_PATH="/var/www/nama-project"#UTE_PATH="/var/www/test.uteparts.id-staging"#' \
;     -e 's#UTE_PHP="/usr/bin/php8.3"#UTE_PHP="/usr/bin/php8.3"#' \
;     -e 's#^user=.*#user=www-data#' \
;     /etc/supervisor/conf.d/ute-parts-queue.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status ute-parts-queue     # harus RUNNING
;
; Lihat deploy/supervisor/README.md untuk diagnosa "job tetap pending".
; =============================================================

[program:ute-parts-queue]
process_name=%(program_name)s_%(process_num)02d
environment=UTE_PATH="/var/www/nama-project",UTE_PHP="/usr/bin/php8.3"
; --timeout=60 : satu job dibiarkan maksimal 60 detik sebelum masuk retry
;                (harus DIBAWAH stopwaitsecs=70 supaya SIGTERM sempat
;                 mengubah status job jadi "lost" dengan rapi).
; --sleep=3    : jeda saat antrean kosong, biar tidak membakar CPU.
; --tries=3   : jumlah percobaan sebelum job masuk tabel failed_jobs.
; --max-time=3600  : exit sendiri tiap 1 jam (ditangkap autorestart) supaya
;                    RAM worker tidak terus menumpuk.
; --max-jobs=1000  : keluar setelah 1000 job, lalu supervisor restart.
; --memory=256     : keluar bila RAM proses tembus 256MB (aman untuk VPS 1GB
;                    yang juga hosting PHP-FPM + web).
command=%(ENV_UTE_PHP)s %(ENV_UTE_PATH)s/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600 --max-jobs=1000 --memory=256
directory=%(ENV_UTE_PATH)s
user=www-data
numprocs=1
autostart=true
autorestart=true
; FATAL saat binary/path salah → supervisor berwarna FATAL, bukan diam-diam
; menampilkan "STARTING" lalu job menumpuk jadi pending.
startsecs=5
startretries=3
; PENTING untuk RAM 1GB: bunuh semua anak (queue:work bisa menyemai
; child saat memproses job berat). Tanpa ini, tiap restart meninggalkan
; proses yatim yang memakan RAM.
stopasgroup=true
killasgroup=true
; Beri worker waktu menyelesaikan job yang sedang jalan (--timeout=60 di bawah).
stopwaitsecs=70
; Supervisor me-restart worker tiap 1 jam supaya kebocoran RAM / cache
; yang menumpuk tidak terus bertambah (--max-time=3600).
redirect_stderr=true
stdout_logfile=%(ENV_UTE_PATH)s/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
; Program user tidak boleh menulis log ke home-nya.
umask=0022

[group:ute-parts-queue]
programs=ute-parts-queue
priority=999
