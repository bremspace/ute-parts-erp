; =============================================================
; ute-parts-queue — Supervisor program + group config (F1-7)
; PRD-Advanced-UteParts §4 F1-7 · RAM 1GB → 1 proses worker.
;
; PATH DI BAWAH UNTUK VPS MANDIRI (Ubuntu + Nginx + PHP-FPM):
;   project : /var/www/ute-parts
;   php     : /usr/bin/php8.4
;   user    : www-data
;
; ⚠️  Bila lokasi project-mu BEDA, sesuaikan dulu SEBELUM `supervisorctl update`:
;     sed -i 's#/var/www/ute-parts#/path/kamu#g; s#/usr/bin/php8.4#/usr/bin/php#g' \
;       /etc/supervisor/conf.d/ute-parts-queue.conf
;
; Install:
;   cp deploy/supervisor/ute-parts-queue.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;   supervisorctl status ute-parts-queue     # harus RUNNING
; =============================================================

[program:ute-parts-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 /var/www/ute-parts/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/ute-parts
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/ute-parts/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:ute-parts-queue]
programs=ute-parts-queue
priority=999
