; =============================================================
; ute-parts-queue — Supervisor program + group config (F1-7)
; PRD-Advanced-UteParts §4 F1-7 · RAM 1GB → 1 proses worker.
;
; ARTIFAK DEPLOY statis — jangan restart/reconfigure supervisor live
; dari file ini tanpa koordinasi; group `ute-parts-queue` sudah RUNNING
; di box ini (sumber config live tidak diketahui).
;
; Install:
;   cp deploy/supervisor/ute-parts-queue.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
; =============================================================

[program:ute-parts-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/test.uteparts.id-staging/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=256
directory=/var/www/test.uteparts.id-staging
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/test.uteparts.id-staging/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:ute-parts-queue]
programs=ute-parts-queue
priority=999
